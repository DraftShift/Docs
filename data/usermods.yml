    - name: Stealthburner Number Cowls
      path: UserMods/Dumplap/Stealthburner Number Cowls
      title: Stealthburner Number Cowls
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/Dumplap/Stealthburner%20Number%20Cowls
      created_commit: 1b05ae0982999c4264a2306a8f231b467b0669a0
      created_date: '2024-10-09T20:54:06Z'
      has_readme: true
      readme_data: "# Stealthburner Number Cowls\nThese are modified cowls for the\
        \ Stealthburner toolhead featuring tool numbers in place of the voron logo.\
        \ They are multi body STLs so you will NEED a tool changer or MMU (AMS) to\
        \ print these. \n\n![Render of SC.076](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Dumplap/Stealthburner%20Number%20Cowls/images/IMG_7425.png)\n\
        ![Render of All Cowls](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Dumplap/Stealthburner%20Number%20Cowls/images/everything.png)\n\
        \n## Materials\nYou will need Transparent ABS/ASA for the numbers as the cowl\
        \ is requires it, and this will be single multi color print. Each cowl will\
        \ require the \"Stealthburner LED Carrier.stl\" which is in the STL directory,\
        \ although will no longer need the \"[c]_stealthburner_LED_diffuser.stl\"\
        \ and <br> \"[o]_stealthburner_LED_diffuser_mask.stl\".  (\"Stealthburner\
        \ LED Carrier.stl\" has been renamed from \"[o]_stealthburner_LED_carrier.stl\"\
        \ which you may already have)\n\n## Printing\nWhen you're slicing load each\
        \ ALL the STLs from one of the tool folders at once, then click \"yes\" for\
        \ \"single body multiple parts\" and then assign you colors/tools. This will\
        \ have to be done one at a time for every tool you have, so I recommend downloading\
        \ the entire folder which will keep them organized. below are folder download\
        \ links for the 2 cowl types. To make you transparent sections better print\
        \ with 100% infill and concentric pattern on all faces (top, bottom, infill).<br>\n\
