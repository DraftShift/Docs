      url: https://github.com/DraftShift/CableManagement/tree/main/UserMods/patrezp/Fysetc_Hexa_distro_fusion_mod
      created_commit: 8d0ec3a69867f2737f53dec6bd7ca767193146db
      created_date: '2025-07-30T19:57:04Z'
      has_readme: true
      readme_data: '# Fysetc Hexa distro fusion holder for StealthChanger

        ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/patrezp/Fysetc_Hexa_distro_fusion_mod/images/hexa_distro_fusion.jpg)

        ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/patrezp/Fysetc_Hexa_distro_fusion_mod/images/hexa_distro_fusion.png)


        Update:

        There''s a V2 for a Cover ramp for [n3mi backplates](/STL/[a]_cover_ramp_n3mi_Hexa_distro_fusion_v2.stl)
        as original version was not matching the M5 bolts distance. Keeping the original
        if someone needs it.



        ____________________________________________________________________________________________________________

        I had to widen (by 22.5mm to each side) the existing base, cover, PTFE ramps
        and cover ramp for n3mi''s umbilical plates, as this board is really big and
        it could not fit the existing FannyPack. Added 1cm on top of the base to add
        more clearance to USB cables.




        ## BOM

        4x voron heatset inserts


        Rest of stuff needed to build FannyPack


        Optional: 90° USB-C cable or adapter, as it is really tough with some cables
        to bend them



        ### Credits

        [DraftShift Design] (https://github.com/DraftShift) for the original FannyPack


        [Fysetc] (https://github.com/FYSETC/Hexa_Distro_Fusion) for releasing the
        drawings for the board'
