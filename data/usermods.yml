    - name: Z_Stop
      path: UserMods/TheSin-/Z_Stop
      title: Shuttle Z Endstop
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/TheSin-/Z_Stop
      created_commit: c88dc5eb7401b664e9e338ac6ac723a6de67f344
      created_date: '2024-06-30T15:55:50Z'
      has_readme: true
      readme_data: '# Shuttle Z Endstop

        This adds a Z Foot to the shuttle to use with a standard Voron endstop switch.  This
        will allow you to Home without a tool.


        ## Instructions

        Print the SB if you are only using SBs

        Print the DB if you are using DBs

        Print the Spacer if you aren''t using any X Endstops.  it''s meant to be using
        believe an X Endstop on the shuttle, the spacer simulates having one.


        ## BOM

        Replace the endstop screw with an m3x10 BHCS


        ## Config

        After the required PR is accepted.


        Only the homing routine needs to be modified.


        Coming Soon.


        ## Video


        [First test](https://www.youtube.com/shorts/LuYX53iF-jE)

        '
