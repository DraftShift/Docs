      readme_data: '# XOL Magdock Adapter

        by [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/) (DraftShift
        Discord: #MikeyMike, VoronDesign Discord: #MikeyMike V2.5796, Voron Toolchangers
