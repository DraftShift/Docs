    - name: Carto_Mounts
      path: UserMods/N3MI-DG/Carto_Mounts
      title: Cartographer Mounts for CNC Shuttles
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/N3MI-DG/Carto_Mounts
      created_commit: ff7dbeaf20e1e043410e34a26831acbce509d41f
      created_date: '2025-07-27T17:54:04Z'
      has_readme: true
      readme_data: "# Cartographer Mounts for CNC Shuttles\n\n## Description\nCartographer\
        \ mounts for Fysetc and LDO CNC shuttles. Tested with Anthead SF and Stealthburner.\n\
        \n## Hardware BOM\n\n- M3x10 SHCS x1\n- M3x16 SHCS x2\n- M3 Heat Insert x3\n\
        - Cartographer\n\n## Printed BOM \n\n- CNC Mount x1\n- X Bracket x1\n- Alignment\
        \ Guides x1\n\n## Preperation\n\n- Install a heat insert in the X Bracket.\n\
        - Install 2 Heat inserts in to the Cartographer mount.\n\n## Instructions\n\
        \n- Press fit the alignment Guides in to the front of the CNC shuttle. If\
        \ using the Fysetc shuttle you will need to remove the built in supports first.\n\
        - Attach the X Bracket to the Cartographer mount using a M3x16 SHCS screw.\n\
        - Attach the Cartographer to the bottom of the mount using the screws it was\
        \ supplied with.\n- Plug the cable into the Cartographer and run the cable\
        \ along the leg opposite the x bracket. Secure with a cable tie.\n- Route\
        \ the cable around the top of the X bracket and through the arm securing with\
        \ a cable tie on the bottom and the inside of the arm.\n- Attach the Cartographer\
        \ mount/X bracket combo to the shuttle by screwing the M3x10 SHCS and remaining\
        \ M3x16 SHCS.\n"
