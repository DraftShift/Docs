      has_readme: true
      readme_data: "# AntHead Hotend Mount – CHCB-V V6DM Edition\n\nThis repository\
        \ contains my personal modifications of the **AntHead** hotend mount to fit\
        \ the  \n**Trianglelab CHCB-V V6DM**.  \n\nthis mount reposition the nozle\
        \ tip to the proper designated location, so proper airflow is maintained.\n\
        \n<img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/CHCB-V-Mount/CHCB-V%20V6DM-SF.png\"\
        \ alt=\"CHCB-V-SF\" width=\"400\">\n\n---\n\n## Features\n\n- ✅ Custom fit\
        \ for the **CHCB-V V6DM**\n- ✅ Maintains the clean look and rigidity of the\
        \ original AntHead design  \n- ✅ Easy to print and install with common tools\
        \  \n- ✅ Compatible with standard V6-style heatblocks and nozzles\n\n---\n\
        \n## Files\n\n- `CHCB-V V6DM-SF.stl` – ready-to-print STL\n- `CHCB-V V6DM-SF.step`\
        \ – editable STEP files for further modification\n\n## Printing Recommendations\n\
        \n- **Material:** ABS/ASA\n- **Nozzle Width:** 0.4 mm  \n- **Layer Height:**\
        \ 0.2 mm  \n- **Infill:** Stadard Voron Presets\n\n## Acknowledgements\n\n\
        - Original **AntHead** design by * <a href=\"https://github.com/PrintersForAnts/AntHead\"\
        >https://github.com/PrintersForAnts/AntHead</a>\n- Trianglelab for the **CHCB-V\
        \ V6DM** hotend\n"
