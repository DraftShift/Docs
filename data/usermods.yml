      - https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches/CAD/NewLatchWithHandle_m2x10mmSHCS_screw_5.5mm_longboi%20v1.f3d
