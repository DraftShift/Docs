    - name: Doorbuffer_Side_Door_latches
      path: UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches
      title: Doorbuffer Side Door Latches
      url: https://github.com/DraftShift/DoorBuffer/tree/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches
      created_commit: a0407224b5ea9393c1de7ed26e733d2359aa39f7
      created_date: '2025-04-06T01:03:53Z'
      has_readme: true
      readme_data: "# Doorbuffer Side Door Latches\n\nSwap your door with your sidepanel\
        \ with two door-buffers and some clips.\n\nA simple blank and a remix of RichardM's\
        \ amazing snap latches \n[Voron 2.4 Filament Latch (or any 2020 extrusion)](https://www.printables.com/model/172368-voron-24-filament-latch-or-any-2020-extrusion)\
        \  \n- remixed for m2 screws and 5.5mm (3mmpanel + 3mm foam - 0.5mm compression)\n\
        \nby \n[MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/) (VoronDesign\
        \ Discord: #MikeyMike V2.5796, Voron Toolchangers Discord: MikeyMike - Github:\
        \ [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/StealthChanger))\n\
        DraftShiftDesign Discord - user-project thread:    https://discord.com/channels/1226846451028725821/1243948065208008705\n\
        \n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches/images/door_buffer_side_door1.jpg\"\
        \ width=\"400\"/>\n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches/images/door_buffer_side_door3.jpg\"\
        \ width=\"400\"/>\n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches/images/door_buffer_side_door2.jpg\"\
        \ width=\"400\"/>\n\n\n## Parts to print:\n- 2x Door Buffer\n- 2x NewLatchWithHandle_m2x10mmSHCS_screw_normal_size_3mm_panel_3mm_foam_2_long.stl\n\
        - 6x NewLatchWithHandle_m2x10mmSHCS_screw_normal_size_3mm_panel_3mm_foam_2.stl\n\
        - 2x 2020_doorbuffer_adapter_blank_for_M5x16_BHCS_x2.stl\n\n## BOM per latch\
        \ (need 6 latches in total):\n| Part                        | for       |\
        \ Amount    | Description|\n|-----------------------------|-----------|-----------|-|\n\
        | M3x12-14mm BHCS/SHCS Screw  | latch     | 6         | M3 BHCS/SHCS screw\
        \ |\n| M2x15mm SHCS Screw          | latch     | 4         | M2 SHCS screw\
        \ |\n| M3x25mm SHCS Screw          | latch     | 4         | M2 SHCS screw\
        \ |\n| M5x16 BHCS Screw            | Adapter   | 2         | M5 BHCS/SHCS\
        \ |\n\n\n"
      thumbnail: https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches/images/door_buffer_side_door1.jpg
      images:
