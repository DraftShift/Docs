  - username: parkycat
    mods:
    - name: THE FILTER with Sexball Clearance
      path: UserMods/parkycat/THE FILTER with Sexball Clearance
      title: THE FILTER with Sexball Clearance
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/parkycat/THE%20FILTER%20with%20Sexball%20Clearance
      created_commit: e1850b2e0c81f4dc1b4aabc19e29ad283aae6db9
      created_date: '2026-02-18T00:46:51Z'
      has_readme: true
      readme_data: "# THE FILTER with Sexball Clearance\nThis mod is a modification\
        \ of [THE FILTER](https://github.com/nateb16/VoronUsers/tree/master/printer_mods/nateb16/THE_FILTER)\
        \ by nateb16.\n\nI edited the side blower to fit symmetrically with the rest\
        \ of THE FILTER setup under the bed. \n\nFor the right side version, you can\
        \ mirror the STLs in your slicer.\n\nI did not have quick disconnect connectors\
        \ available so everything was wired into Wago with some wire slack for carbon\
        \ swapping. For secure magnetic mounting, it takes 6 3x6mm magnets.\n\nParts\
        \ Needed:\n\n* 5015 Fan, I used GDSTime Dual Ball\n* 6 3x6mm magnets (For\
        \ Magmount and body, You can get away with 4)\n* 2 Roll-in M3 Nuts (For Magmount)\n\
        * 2 M3x12 Screw, any head (For Magmount)\n* 2 M3x4x5 Heat-set insert or M3\
        \ Nuts (For Fan)\n* 2 M3 BHCS Screw of good enough length (For Fan)\n\nAssembly:\
        \ \n\n* Insert Heatset insert into the bottom of the 5015 Fan (Or skip and\
        \ use M3 Nuts)\n* Carefully unclip the top plastic portion of the 5015 Fan\n\
        * Insert Fan into Body.STL and screw in with M3 BHCS\n* Insert Magnets into\
        \ the mount and body.stl\n* Add carbon and slide in the cover\n* Screw in\
        \ the magmount to the bed 2020 extrusion\n* Wire as needed and you're done!\
        \ \n\n\nPrint settings: Voron Standard with no supports.\n\n![](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/parkycat/THE%20FILTER%20with%20Sexball%20Clearance/Images/InstalledNoBed.jpg%3Fraw%3Dtrue)\n\
        \n![](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/parkycat/THE%20FILTER%20with%20Sexball%20Clearance/Images/InstalledWithBed.jpg%3Fraw%3Dtrue)\n\
        \n![](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/parkycat/THE%20FILTER%20with%20Sexball%20Clearance/Images/AssembledWithFan.jpg%3Fraw%3Dtrue)\n\
        \n![](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/parkycat/THE%20FILTER%20with%20Sexball%20Clearance/Images/InsideCarbonCubby.jpg%3Fraw%3Dtrue)\n\
        \n![](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/parkycat/THE%20FILTER%20with%20Sexball%20Clearance/Images/VentsView.jpg%3Fraw%3Dtrue)\n\
        \n![](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/parkycat/THE%20FILTER%20with%20Sexball%20Clearance/Images/BackSide.jpg%3Fraw%3Dtrue)\n\
        \n\n"
