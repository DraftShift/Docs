    - name: Bushings_5.5
      path: UserMods/traxman25/Bushings_5.5
      title: 5.5 OD Bushing
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/traxman25/Bushings_5.5
      created_commit: 0a2d56b565ed5e603996200372af976acf09cd1f
      created_date: '2024-02-02T05:56:58Z'
      has_readme: true
      readme_data: "# 5.5 OD Bushing\n\nThis Shuttle uses 5.5mm OD PTFE Lined bushings\
        \ that are more readily available in the US from McMasterCarr. The PTFE lining\
        \ is more slippery than steel or bronze bushings and has a working temperature\
        \ of up to 270 degrees C.\nThe Shuttle is designed to have a slight press\
        \ fit to the bushing so you will need to have a well-tuned printer and print\
        \ profile. Using calipers to measure the part’s outside and hole’s inside\
        \ dimensions to calibrate part shrinkage settings in the slicer is necessary.\
        \ \nAlso attached is a print profile for Orca Slicer with the part in the\
        \ print orientation that I used, and manual supports pre-painted. \n\n# BOM\n\
        [Bushings](https://www.mcmaster.com/6679K31/)\n"
