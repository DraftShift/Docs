    - name: NH36Sock
      path: UserMods/Nic335/NH36Sock
      title: Umbilical Sock for NiteHawks36
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/Nic335/NH36Sock
      created_commit: d6363920425aed4c8d180ffffd30af195d221061
      created_date: '2024-12-29T01:39:20Z'
      has_readme: true
      readme_data: "# Umbilical Sock for NiteHawks36\r\n\r\nThis was designed to properly\
        \ constrain the connector from flexing the NiteHawk36 and securely mount the\
        \ umbilical spring steel to the toolhead\r\nthis is also specific to [UserMods/TheSin-/PCB36_Mount/PCBMount.stl](../../TheSin-/PCB36_Mount/PCBMount.stl)\r\
        \n\r\n\r\n<table>\r\n  <tr>\r\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/NH36Sock/images/complete.png\"\
        \ width=\"280\"/></td>\r\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/NH36Sock/images/2.png\"\
        \ width=\"200\"/></td>\r\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/NH36Sock/images/4.png\"\
        \ width=\"350\"/></td>\r\n  </tr>\r\n  <tr>\r\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/NH36Sock/images/cables1.jpg\"\
        \ width=\"300\"/></td>\r\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/NH36Sock/images/cables2.jpg\"\
        \ width=\"300\"/></td>\r\n  </tr>\r\n</table>\r\n\r\n## Assembly\r\n\r\n-\
        \ cable needs to be completely feed thru before **termination!** (now has\
        \ a split variant, credit: <a href=\"https://github.com/seenit783/seenit783\"\
        >seenit783</a>)\r\n- verify that the connector is orientated the properly\
        \ relative to the PCB\r\n- Push firmmly once aligned with hole while aligning\
        \ eletrical connector\r\n- TieWrap should be put into the mounting point and\
        \ the front of the tool, capturing the mount inside the sock.\r\n\r\n<img\
        \ src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/NH36Sock/images/5.png\"\
        \ style=\"width:280px;\"/>\r\n\r\n## Printing Directions\r\n\r\nMust be printed\
        \ in TPU\r\nPrint\r\n\r\n- No InFill\r\n- 3 walls @ .4\r\n\r\n## Bill of Materials\
        \ (BOM)\r\n\r\n- 1 x 2.5mm TieWrap\r\n- Part must be printed from TPU\r\n\r\
        \n## Credits\r\n\r\nSpecial thanks to N3MI-DG for basically making this rocket\
        \ sock look so good!\r\n\r\n"
