    - name: ToolCrash
      path: UserMods/cekim-git/ToolCrash
      title: tool_crash
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/cekim-git/ToolCrash
      created_commit: 06eb71ea75d549e8e59e47f359f72817672cea7c
      created_date: '2025-10-30T12:06:09Z'
      has_readme: true
      readme_data: "# tool_crash\n\nWork in progress to develop crash detection plugin\
        \ for klipper-toolchanger that supports inductive as well as tap probes and\
        \ attempts address issues with existing crash detection\n\n# Usage\n- Install\n\
        \  ```\n  wget -O - https://raw.githubusercontent.com/DraftShift/StealthChanger/refs/heads/main/UserMods/cekim-git/ToolCrash/install.sh\
        \ | bash\n  ```\n- add [tool_crash] to printer.cfg\n  - See [example tool_crash.cfg](./tool_crash.cfg)\n\
        \  - Suggested initial configuration for inductance Z configurations is no\
        \ arguments to this section\n  - Suggested initial configuration for TAP configurations\
        \ would be ingore_events: probing\n  - [tool_crash] should be added AFTER\
        \ your toolchanger and tool .cfg files are included in your printer.cfg \n\
        - add start/stop calls to [homing_override] and PRINT_START/PRINT_END as previously\
        \ with names\n  - START_TOOL_CRASH_DETECTION/ STOP_TOOL_CRASH_DETECTION\n\
        \    - Typical configuration will start during PRINT_HOME and stop during\
        \ PRINT_END.\n    - Docking is implicitly ignored regardless of configuration.\
        \  No additional start/stop around docking is required\n    - Particularly\
        \ for inductive (vs TAP) homing, it might make sense to START/STOP within\
        \ your homing_override as well to detect crashes when manually homing.\n \
        \ - NOTE: you should remove any calls to existing toolchanger based START/STOP_TOOL_PROBE_CRASH_DETECTION\
        \ (note the additional \"PROBE\" in the name)\n- If using inductive probing,\
        \ no TAP trigger should occur during homing... so no further action should\
        \ be required\n- If using TAP probing you can either add STOP/START to your\
        \ homing_override use use the ignore feature in the [tool_crash] .cfg section\n\
        \  - ignore_events: probing\n- Other configuration variables which can be\
        \ changed, but should not need to be:\n  - watchdog_interval: 0.5  \\# seconds\
        \ between consistency checks\n  - watchdog_threshold: 2   \\# number of times\
        \ we must see an error condition prior to reporting it\n  - home_timeblock:\
        \ 1.0     \\# time in seconds after a homing event before instant error reporting\n\
        \  - crash_gcode: \\# custom gcode called in place of the hard-shutdown on\
        \ error... NOT REQUIRED\n  - WARNING: adding optional crash_gcode (other than\
        \ M112) delays the response to a crash event by an amount dependant on what\
        \ is queued up in terms of \"movement\" in the print.  Depending on the queued\
        \ events, this can be seconds or minutes of delay.  For the most rapid response\
        \ to TAP triggering, remove crash_gcode entirely from your configuration.\
        \  In testing, this has allowed it to catch and stop crashes before the head\
        \ has even left the shuttle.  There is no guarantee it will stop it that fast,\
        \ it depends on the speed of the \"crash\" event and the movement around it.\n\
        - watchdog_interval is the time in seconds between consistency checks of toolchanger\
        \ internal state\n- watchdog_threshold is the number of times an error condution\
        \ must be observed by the watchdog before emitting an error\n- home_timeblock\
        \ is the time that must after a home probe event before instant TAP sensor\
        \ error detection will be reported if \"ignore_events: probing\" is set....\
        \ \n"
      thumbnail: null
      images: []
      stls: []
      cads: []
