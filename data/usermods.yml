  - username: MugenMicko
    mods:
    - name: A4T CHCB-V Cowl
      path: UserMods/MugenMicko/A4T CHCB-V Cowl
      title: A variation on A4T Cowl (Sherpa and Orbitor 2 Mounting Pattern) to facilitate
        the Triangle Labs CHCB-V
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/MugenMicko/A4T%20CHCB-V%20Cowl
      created_commit: 6ce49de6c808d345f8ed3296669b3df880abb505
      created_date: '2025-12-03T12:32:54Z'
      has_readme: true
      readme_data: "# A variation on A4T Cowl (Sherpa and Orbitor 2 Mounting Pattern)\
        \ to facilitate the Triangle Labs CHCB-V\n\n## Purpose\nTriangle Labs CHCB-V\
        \ hotend has become increasingly popular for use in the Stealthchanger system\
        \ given its quality, flow rate and price.  \nAs people where looking for a\
        \ high performing toolhead from an cooling perspective, A4T being the best\
        \ available currently without going to a CPAP system which complicates SC\
        \ builds, I created a version\nthat facilitates the additional length (1.87mm)\
        \ allowing the TL CHCB-V in an A4T Toolhead using the Sherpa Mini Mounting\
        \ Pattern. It also adjust the mounting holes so you can use the screws that\
        \ came\nwith the hotend.\n\n## What do I need to print and hardware\nOnly\
        \ need to print the cowl, the rest is as per standard A4T. CAD and STL Provided\n\
        \n# Credits\n[DW-Tas](https://github.com/Armchair-Heavy-Industries/A4T) for\
        \ the base I worked from and the amazing toolhead design.\n"
