  - username: Sjack1209
    mods:
    - name: Jabberwocky_Stealthchanger_NH36_Mount
      path: UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount
      title: Jabberwocky Stealthchanger NH36 Mount
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount
      created_commit: 52279e0d4dd4eb4f8a1220c78412b2a11bfc0c14
      created_date: '2026-01-03T03:11:11Z'
      has_readme: true
      readme_data: "# Jabberwocky Stealthchanger NH36 Mount\n\nThis was designed to\
        \ properly mount the NiteHawk36 to the Jabberwocky Toolhead while using the\
        \ Stealtchanger backplate and optical sensor. \n\nThe spacer is not required,\
        \ but without it the mount sits directly against the back of the extruder\
        \ stepper.\n\nThis is a remix of [UserMods/TheSin-/PCB36_Mount/PCBMount.stl](../../TheSin-/PCB36_Mount/PCBMount.stl)\
        \ and is intended to be used with [UserMods/Nic335/NH36Sock/SplitSock.3mf](../../Nic335/NH36Sock/SplitSock.3mf)\
        \ for attaching the umbilical\n \n<table>\n  <tr>\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/CAD1.png\"\
        \ width=\"280\"/></td>\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/CAD2.png\"\
        \ width=\"200\"/></td>\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/CAD3.png\"\
        \ width=\"350\"/></td>\n  </tr>\n  <tr>\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/spacer.jpg\"\
        \ width=\"300\"/></td>\n    <td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Assembled.jpg\"\
        \ width=\"300\"/></td>\n\t<td><img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Assembled1.jpg\"\
        \ width=\"350\"/></td>\n  </tr>\n</table>\n\n## Printing\n\nUse standard voron\
        \ print settings. 4 walls, 5 top & bottom laters, 40% infill.\n\n![photo](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/photo.jpg)\n\
        \n\n## Installation\n\ninsert 2 heatset inserts into the back of the mount\
        \ \n\n<img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Heatsets.jpg\"\
        \ style=\"width:280px;\"/>\n\nThen attach the mount and spacer to the Toolhead\
        \ using 2 M3x10 or M3x12 BHCS \n\n<img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Attached.jpg\"\
        \ style=\"width:280px;\"/>\n\nNext, attach the NH36 with either 2 or 4 M3x8\
        \ BHCS\n\n<img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Assembled.jpg\"\
        \ style=\"width:280px;\"/>\n\n\n## Bill of Materials (BOM)\n\nqty 2 M3 heatset\
        \ inserts\n\n\n## Credits\n\nThanks to TheSin- for the original PCBMount file\
        \ that was used.\n"
      thumbnail: https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Assembled.jpg
      images:
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Assembled.jpg
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Sjack1209/Jabberwocky_Stealthchanger_NH36_Mount/Images/Assembled1.jpg
