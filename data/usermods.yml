    - name: Endstops
      path: UserMods/VIN-y/Endstops
      title: Endstops
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/VIN-y/Endstops
      created_commit: 3b293b72ca0bf430164fe02f6b98924fa1075798
      created_date: '2024-01-09T23:40:14Z'
      has_readme: true
      readme_data: "This mod is a remixing the endstop carrier from [MrTeliP](https://www.printables.com/model/325765-voron-24r2-pg7-cable-gland-and-endstop)\
        \ (on Printables)\n\n### Pupose\nIt move the X and Y endstop switches to a\
        \ single assembly, which attached to the stock Voron A(Y) motor mount. \n\n\
        ### Assembly\nThis assembly is held in place by replacing the original two\
        \ M3x30mm bolts with two M3x35mm bolts, which passed through the holes on\
        \ the assembly (See the **Images** folder).\n\n### How it works\nYou might\
        \ need to mod the homing config to get the right rebound on Y after homing\
        \ Y.\n\nLook for this line\n```\nG0 Y{ max_y - 20 } F5000\n```\n\nThe 20 is\
        \ the amount of rebound, you'll likely want around 4\n```\nG0 Y{ max_y - 4\
        \ } F5000\n```\n\n**NOTE:** the switch arm is not compatible with shuttle\
        \ keeper, you will need to add 5-6mm to the arm if you are using shuttle keeper\
        \ or you won't be able to reach the switch.\n"
