    - name: SexBolt 2020 Top Mount
      path: UserMods/Dumplap/SexBolt 2020 Top Mount
      title: SexBolt 2020 Top Mount
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/Dumplap/SexBolt%202020%20Top%20Mount
      created_commit: 9b57f7ff87eb9f73766f4605f4858af756dec12d
      created_date: '2024-12-20T15:15:04Z'
      has_readme: true
      readme_data: '# SexBolt 2020 Top Mount

        Top Mount for the SexBolt Probe that uses hartk1213''s Z-Endstop Probe, mounting
        on top of the 2020 bed extrusions can be helpful for large filter setups or
        kinematic beds.


        ![SexBolt Mount Single](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Dumplap/SexBolt%202020%20Top%20Mount/images/IMG_7857.png)


        ## Hardware

        2x M3 Heatset''s (Voron Spec) <br>

        2x M3x20 SHCS <br>

        2x M3x6 BHCS        *spacers are used for large filters and require an 8mm
        screw <br>

        2x M3 T-Nut <br>


        ### Notes

        - The stock recommended length for the M5 External Thread Pin is 30mm, however
        this can be shortened with a top mount to 25mm.

        - Be carful when inserting the heatsets as if they are inserted even slightly
        too far they will prevent your sexbolt from sitting vertical <br>

        - The STEP file has the Bushing intersecting the body, dont worry about it,
        it works...   the 2.25mm spacer is designed to only be the width of the extrusion
        to allow for 4 nevermore and other carbon filters.

        ---

        ![SexBolt Mount Single](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Dumplap/SexBolt%202020%20Top%20Mount/images/IMG_7855.png)

        ![SexBolt Mount Single](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Dumplap/SexBolt%202020%20Top%20Mount/images/IMG_7854.png)


        ### Credits

        Thanks to hartk1213 for his Z-Endstop Probe'
