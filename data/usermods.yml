        \n\n### Umbilical Plate Installation\nIf you have one, install the logo insert.\
        \ The insert is indexed with a couple tabs which need to be inserted first.\
        \ The bottom will press fit in to place.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/insert.jpg)\n\
        The Voron face plate requires 4 heatset inserts to be installed.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/heaset_insert.jpg)\n\
        Optionally you can add some foam to the mating surface of the face place.\n\
        ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/foam.jpg)\n\
        If you have a SC Barf LED, press fit it in to the outer plate.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/sc_barf.jpg)\n\
        Mate the face plate and outer plate together by putting the face plate over\
        \ one side of the ports and flexing it over the other. It may feel like the\
        \ pieces don't fit at first, but with a bit of flex and force the face plate\
        \ will go over all of the ports.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/flex.jpg)\n\
        Install the plates on to the back panel of the printer. You need to have the\
        \ panel removed from the frame or at least undo the top clips so that it can\
        \ be installed from the outside of the printer.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/panel.jpg)\n\
        For the Voron version, secure the back plate to the frame with 2 M5x10 BHCS\
        \ screws and the outer plate to the face plate with 4 M3x8 SHCS screws.\n\
        ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/installed_voron.jpg)\n\
        The Micron version gets secured to the frame with 2 M3x10 SHCS and the outer\
        \ plate to the face plate with 2 M2x10 self tapping screws.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/installed_micron.jpg)\n\
        If you are using the threaded back plates the spring steel/piano wire can\
        \ be secured to the back plate with a M3 heat insert, M3x6 BHCS and M3 washer.\n\
        ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/thread_spring.jpg)\n\
        ___\n## Umbilical Restraints\nThere are 2 different ports for the umbilical\
        \ plates.\n- TPU - Uses a TPU printed cable relief.\n- THREADED - Uses either\
        \ M12x1.5 or PG7 cable glands.\n\nThere are 2 supported methods of taming\
        \ the umbilical.\n- Flat Spring Steel - 0.3x3mm (preferred) [Link](https://www.aliexpress.com/item/1005006731615186.html\
        \ \"Aliexpress\")\n- Piano Wire - 1mm\n\n### TPU STL Files\nTo download the\
        \ TPU restraint STL files select one of the links below.\n###### Spring Steel\n\
        - [Voron 3.7mm cable](STL/TPU%20Umbilical/Voron/Spring/3.7mm%20Cable)\n- [Voron\
        \ 4mm cable](STL/TPU%20Umbilical/Voron/Spring/4mm%20Cable)\n- [Voron 4.5mm\
        \ cable](STL/TPU%20Umbilical/Voron/Spring/4.5mm%20Cable)\n- [Voron 5mm cable](STL/TPU%20Umbilical/Voron/Spring/5mm%20Cable)\n\
        - [Voron 5.5mm cable](STL/TPU%20Umbilical/Voron/Spring/5.5mm%20Cable)\n- [Voron\
        \ 6mm cable](STL/TPU%20Umbilical/Voron/Spring/6mm%20Cable)\n- [Voron 6.35mm\
        \ cable](STL/TPU%20Umbilical/Voron/Spring/6.35mm%20Cable)\n- [Micron 3.7mm\
        \ cable](STL/TPU%20Umbilical/Micron/Spring/3.7mm%20Cable)\n- [Micron 4mm cable](STL/TPU%20Umbilical/Micron/Spring/4mm%20Cable)\n\
        - [Micron 4.5mm cable](STL/TPU%20Umbilical/Micron/Spring/4.5mm%20Cable)\n\
        - [Micron 5mm cable](STL/TPU%20Umbilical/Micron/Spring/5mm%20Cable)\n- [Micron\
        \ 5.5mm cable](STL/TPU%20Umbilical/Micron/Spring/5.5mm%20Cable)\n- [Micron\
        \ 6mm cable](STL/TPU%20Umbilical/Micron/Spring/6mm%20Cable)\n- [Micron 6.35mm\
        \ cable](STL/TPU%20Umbilical/Micron/Spring/6.35mm%20Cable)\n###### Piano Wire\n\
        - [Voron 3.7mm cable](STL/TPU%20Umbilical/Voron/Wire/3.7mm%20Cable)\n- [Voron\
        \ 4mm cable](STL/TPU%20Umbilical/Voron/Wire/4mm%20Cable)\n- [Voron 4.5mm cable](STL/TPU%20Umbilical/Voron/Wire/4.5mm%20Cable)\n\
        - [Voron 5mm cable](STL/TPU%20Umbilical/Voron/Wire/5mm%20Cable)\n- [Voron\
        \ 5.5mm cable](STL/TPU%20Umbilical/Voron/Wire/5.5mm%20Cable)\n- [Voron 6mm\
        \ cable](STL/TPU%20Umbilical/Voron/Wire/6mm%20Cable)\n- [Voron 6.35mm cable](STL/TPU%20Umbilical/Voron/Wire/6.35mm%20Cable)\n\
        - [Micron 3.7mm cable](STL/TPU%20Umbilical/Micron/Wire/3.7mm%20Cable)\n- [Micron\
        \ 4mm cable](STL/TPU%20Umbilical/Micron/Wire/4mm%20Cable)\n- [Micron 4.5mm\
        \ cable](STL/TPU%20Umbilical/Micron/Wire/4.5mm%20Cable)\n- [Micron 5mm cable](STL/TPU%20Umbilical/Micron/Wire/5mm%20Cable)\n\
        - [Micron 5.5mm cable](STL/TPU%20Umbilical/Micron/Wire/5.5mm%20Cable)\n- [Micron\
        \ 6mm cable](STL/TPU%20Umbilical/Micron/Wire/6mm%20Cable)\n- [Micron 6.35mm\
        \ cable](STL/TPU%20Umbilical/Micron/Wire/6.35mm%20Cable)\n\n Optionally, there\
        \ is also a TPU plug to block the ports if you do not have all of your tools\
        \ built. [Link](STL/TPU%20Umbilical/Relief_Plug.stl, \"TPU Plug\")\n### Installation\n\
        You need to print 1 Relief, 1 Terminator and enough Clips to keep your umbilical\
        \ tidy (typically 4-6) per tool.\nThe spring steel/piano wire length should\
        \ be the diagonal length of your bed + enough material for bending (~25mm).\
        \ This is a good starting point for Voron printers.\n#### Spring Steel\nSpring\
        \ steel can snap rather easily when bending. Before bending heat the area\
        \ with a blow torch or lighter to a cherry red and let it cool. This makes\
        \ the steel more ductile and will bend without snapping.\nIf there is too\
        \ much friction while feeding the spring steel you can add a dab of dish washing\
        \ liquid as a lubricant.\n<br/>Insert the spring steel through the strain\
        \ relief and out the back. Bend it 180 degrees 12mm from the end.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/bend1.jpg)\
        \ ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/bend1_1.jpg)\n\
        <br/>Do a second bend at ~60 degrees 6mm from the end that was bent in the\
        \ previous step.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/bend2.jpg)\
        \ ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/bend2_1.jpg)\n\
        <br/>![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/relief.jpg)\n\
        <br/>Feed the spring steel through all of the clips matching the hole orientation\
        \ to the strain relief.<br/>![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/clips.jpg)\n\
        <br/>Feed the spring steel through the terminator and do 2 bends at ~30 degrees.\
        \ Feed the spring steel back until the bend is inside the slot for the spring\
        \ steel.<br/>![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/bend3.jpg)\
        \ ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/terminator.jpg)\n\
        <br/>Mount the bowden tube and cable in the strain relief and inset the strain\
        \ relief into the plate. This is the time to determine the length you need.\
        \ With the strain relief inserted in the back plate, run your cable to the\
        \ tool while it is at the largest travel position for that specific tool.\
        \ For instance, T0 would be at MAX_X and MIN_Y, The last tool would be at\
        \ MIN_X and MIN_Y. Make sure that at that position there is minimal slack,\
        \ but there should be some. You do not want the umbilical to be putting strain\
        \ on the toolhead. Then work your way back from the toolhead and insert the\
        \ bowden tube and cable into the termination print, and then the clips (which\
        \ can be spaced evenly). If at any point there is too little or too much slack,\
        \ pull out the strain relief and adjust it.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/umbilical.jpg)\n\
        <br/>Optionally you can add some heat shrink (with glue) to keep the clips\
        \ from moving.<br/>![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/shrink.jpg)\n\
        #### Piano Wire\nThe procedure for piano wire is much the same as spring steel\
        \ except the wire gets 2 90 degree bends at the Relief and Terminator.\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/wire_1.jpg)\n\
        ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/wire_3.jpg)\n\
        ![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/wire_2.jpg)\n\
