      readme_data: "# A PCB Mounting solution for Anthead with WWG2 and EBB36\n##\
        \ Purpose\nSomeone reached out commenting on my build which led to the discussion\
        \ of his planned build being Anthead SF, WWG2 and EBB36 Gen2. This appears\
        \ to be a pretty common combination but there was no quick easy solution for\
        \ mounting, so I created one.  TheSin-[^1] had created amazing mounting solution\
        \ for Orbitor 2 and an LGX based extruder which I have based this mod off\
        \ of. \n\n## What does it achieve?\nTheSin-'s design connects the toolhead\
        \ board to the backplate and the extruder to ensure rigidity and lack of movement,\
        \ this mod does\nthe same thing.  This mod also takes into account component\
        \ placement on the toolhead board utilising key positioned stand offs to ensure\n\
        the board triangilated on the mount. An additional bonus is that it braces\
        \ the extruder preventing rotation and reducing vibrations.\n\n\n>[!WARNING]\n\
        >It may work for other 36 style boards but no promises. The cad (fusion360)\
        \ is there if you want to modify things to suit your toolhead board.\n\n##\
        \ What do I need to print and hardware\nThe backplate, the backplate spacer\
        \ and the toolhead board PCB Mount.  The EBB36 comes with 2 x 20mm brass stand\
        \ offs which are screwe\nbetween the extruder and the PCB Mount/PCB \n\n![Image1](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20WWG2%20EBB36%20PCB%20Mount/Anthead_SF_WWG2.png)\
        \ \n\n[^1]: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/TheSin-/PCB36_Mount\n\
        # Credits\n[TheSin-](https://github.com/TheSin-) for the base I worked from,\n\
        [N3MI-DG](https://github.com/N3MI-DG), @Myrkalear, [@Nic335](https://github.com/nic335),\
        \ [jdmontgomer](https://github.com/jdmontgomer) and @strothgar for pointing\
        \ out these amazing designs, inspiring me and being top people\n"
      thumbnail: https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20WWG2%20EBB36%20PCB%20Mount/Anthead_SF_WWG2.png
