  - username: MajorHack
    mods:
    - name: PCB36mount for TheSin backplate
      path: UserMods/MajorHack/PCB36mount for TheSin backplate
      title: MajorHack PCB36 Mount for TheSin Backplate & G2SA
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/MajorHack/PCB36mount%20for%20TheSin%20backplate
      created_commit: 806fdcc256ba82825350b05d735edda5980c6fb1
      created_date: '2025-12-03T12:32:34Z'
      has_readme: true
      readme_data: "# MajorHack PCB36 Mount for TheSin Backplate & G2SA\n\nThis PCB36\
        \ mount is designed for use with [TheSin's backplate](https://github.com/DraftShift/StealthChanger/tree/main/UserMods/TheSin-/PCB36_Mount)\
        \ and provides secure mounting for EBB36, Nighthawk36, and SHT36 toolhead\
        \ PCBs.\n\n<img src=\"https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MajorHack/PCB36mount%20for%20TheSin%20backplate/images/G2SA_backplate.png\"\
        \ width=\"400\">\n*PCB36 mount installed on TheSin's backplate with G2SA extruder*\n\
        \n## Compatible Extruders\n\nThis mount is **back-compatible** with [TheSin's\
        \ original PCB36 mount](https://github.com/DraftShift/StealthChanger/tree/main/UserMods/TheSin-/PCB36_Mount),\
        \ which supports:\n- **CNC HGX Sherpa**\n- **Orbiter 2** (Orbiter 2.5)\n\n\
        Additionally, this mount **adds support for the [G2SA (Galileo 2 Standalone)](https://github.com/JaredC01/Galileo2/tree/main/galileo2_standalone)**\
        \ extruder. The G2SA is a drop-in replacement for Orbiter 2.0 or Sherpa Mini\
        \ extruders, but the motor screw mount locations are slightly different.\n\
        \n## Parts Required\n\n- **PCB Mount**: [`TheSin Backplate - PCBMount - G2SA.stl`](TheSin\
        \ Backplate - PCBMount - G2SA.stl) or [`TheSin backplate - PCBMount - G2SA.step`](TheSin\
        \ backplate - PCBMount - G2SA.step) (for CAD)\n- **Standoffs**: [`Standoff\
        \ - M3x17.5.stl`](Standoff - M3x17.5.stl) or [`Standoff - M3x17.5.step`](Standoff\
        \ - M3x17.5.step) (2 required)\n- **Heatset Inserts**: Standard Voron M3 heatset\
        \ inserts \n   - 2 per standoff\n   - 2 for PCB mount\n\n## Printing Notes\n\
        \n- **Print without supports** - both the mount and standoffs print cleanly\
        \ without supports\n- Recommended: 0.2mm layer height, 3-4 perimeters, 30-40%\
        \ infill\n\n## Installation\n\n1. Install heatset inserts into the standoffs\
        \ (2 standard Voron M3 heatset inserts per standoff, 4 total)\n2. Install\
        \ the 4 M3x17.5mm standoffs into the PCB mount\n3. Attach the PCB mount (with\
        \ standoffs) to TheSin's backplate using the provided mounting points\n4.\
        \ Screw the PCB mount into the standoffs with M3x6 screws.\n5. Place your\
        \ EBB36, Nighthawk36, or SHT36 board onto the standoffs and secure with M3\
        \ screws (M3x6 or M3x8)\n\n\n## Compatibility Notes\n\n- **Extruders**: Back-compatible\
        \ with CNC HGX Sherpa and Orbiter 2 (via TheSin's original mount). Adds G2SA\
        \ support.\n- **Standoffs**: Use 17.5mm standoffs for G2SA. Original TheSin\
        \ mount uses 20mm standoffs.\n- **Backplate**: Designed specifically for TheSin's\
        \ backplate\n- **PCB**: Compatible with EBB36, Nighthawk36, and SHT36 boards\n\
        \n## Related Resources\n\n- [TheSin's PCB36 Mount Repository](https://github.com/DraftShift/StealthChanger/tree/main/UserMods/TheSin-/PCB36_Mount)\n\
