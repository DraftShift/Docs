    - name: Anthead Sherpa Mini EBB 36 PCB Mount
      path: UserMods/MugenMicko/Anthead Sherpa Mini EBB 36 PCB Mount
      title: A PCB Mounting solution for Anthead with Sherpa Mini and EBB36
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount
      created_commit: 15bcaed303c25bbf08381e5211aa4db4a7049b38
      created_date: '2025-08-18T15:05:54Z'
      has_readme: true
      readme_data: "# A PCB Mounting solution for Anthead with Sherpa Mini and EBB36\n\
        ## Purpose\nWhilst building my Stealthchanger Voron 2.4, my focus was being\
        \ cable and cost effective, utilising some parts I had on hand\nand to keep\
        \ cost down without compromising on capability and quality.  This lead me\
        \ down the path of using Anthead, TZ V6 2.0,\nSherpa Mini and BTT EBB36 toolhead\
        \ board. This appears to be a pretty common combination but there was an issue\
        \ with the extruder\nrotating on the Y Axis and the toolhead board mounts\
        \ allowed the board to vibrate on the Y and Z axis.  TheSin-[^1] had created\
        \ amazing\nmounting solution for Orbitor 2 and an LGX based extruder which\
        \ I have based this mod off of. \n\n## What does it achieve?\nTheSin-'s design\
        \ connects the toolhead board to the backplate and the extruder to ensure\
        \ rigidity and lack of movement, this mod does\nthe same thing.  This mod\
        \ also takes into account component placement on the toolhead board utilising\
        \ key positioned stand offs to ensure\nthe board triangilated on the mount.\
        \ I have also included a backplate spacer to facilitate cable routing and\
        \ the toolhead board mount has\ncutouts to route wires through.  An additional\
        \ bonus is that it braces the extruder preventing rotation and reducing vibrations.\n\
        \n## Revision 9 now uploaded\nFound that earlier version may cause torsion\
        \ twist in extruder with certain gear sets, new version rectifies that issue\
        \ and adds ability to capture the spring steel and improve umbilical control.\
        \ Also has built in supports for printing of the spring steel capturing section\n\
        \n\n>[!WARNING]\n>It may work for other 36 style boards but no promises. The\
        \ cad (fusion360) is there if you want to modify things to suit your toolhead\
        \ board.\n\n## What do I need to print and hardware\nThe backplate, the backplate\
        \ spacer and the toolhead board PCB Mount.  The EBB36 comes with 2 x 20mm\
        \ brass stand offs which are screwe\nbetween the extruder and the PCB Mount/PCB\
        \ \n\n\n![Image1](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/Toolhead_Updated.png)\
        \  ![Image2](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/Toolhead_Updated_2.png)\
        \ ![Front](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/front.jpg)\
        \ ![side](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/side.jpg)\
        \ ![back](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/back.jpg)\n\
        \n\n[^1]: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/TheSin-/PCB36_Mount\n\
        # Credits\n[TheSin-](https://github.com/TheSin-) for the base I worked from,\n\
        [N3MI-DG](https://github.com/N3MI-DG), @Myrkalear, [@Nic335](https://github.com/nic335),\
        \ [jdmontgomer](https://github.com/jdmontgomer) and @strothgar for pointing\
        \ out these amazing designs, inspiring me and being top people\n"
      thumbnail: https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/Toolhead_Updated.png
      images:
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/Toolhead_Updated.png
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/Toolhead_Updated_2.png
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/back.jpg
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/front.jpg
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/image1.png
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/image2.png
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/Image/side.jpg
      stls:
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/STL/Anthead%20Backplate%20HF%20Rev%205.stl
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/STL/Anthead%20Backplate%20Rev%205.stl
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MugenMicko/Anthead%20Sherpa%20Mini%20EBB%2036%20PCB%20Mount/STL/Anthead%20Backplate%20UHF%20Rev%205.stl
