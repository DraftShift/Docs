      title: Umbilical System for StealthChanger
      url: https://github.com/DraftShift/CableManagement/tree/main/UserMods/N3MI-DG/Umbilical_plates_V2
      created_commit: 990f3796db2495eee5d6f862c82a15abfcbdfbc7
      created_date: '2025-01-05T23:55:04Z'
      has_readme: true
      readme_data: "# Umbilical System for StealthChanger\n![](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/images/plate_tpu.jpg)\n\
        ## Introduction\nThis umbilical system is ultimately made up of 2 components.\
        \ The \"Umbilical Plate\" which mounts to the rear panel of your Voron V2\
        \ or Micron printer and the \"Umbilical Restraints\" that help tame the umbilical\
        \ on its way to the tool head.\nThere are various combinations on how these\
        \ components can be configured, choose wisely.\n## Umbilical Plate\nTo choose\
        \ the appropriate umbilical plate for your setup there are 6 things to consider.\n\
        - The type of printer you have.\n- The size of the printer.\n- The amount\
        \ of tools you want to support.\n- The type of umbilical you are using, TPU\
        \ or Threaded.\n- The width of the docks for the tools you are using.\n- How\
        \ the docks are positioned on the printer, Left, Right, Centered or Split.\n\
        \nThe docks play a big role in this system and based on which tools you are\
        \ using there can be 2 different nominal dock widths.\n\n###### 60mm Nominal\
        \ Width Docks\n- Anthead\n- Dragon Burner\n- Mini StealthBurner\n- Yavoth\n\
        \n###### 76mm Nominal Width Docks\n- A4T\n- Archetype Blackbird\n- StealthBurner\n\
        - XOL\n\nFrom the below tables, select the appropriate umbilical plate configuration\
        \ for your setup.\n<details name=\"printers\">\n<summary style=\"cursor: pointer;\"\
        >Voron 250mm TPU 60mm Wide Dock</summary>\n\n### Voron 250mm TPU 60mm Wide\
        \ Dock\n| Tool Count | Left | Right | Center | Split |\n|-|-|-|-|-|\n| 2 |[<img\
        \ src=\"https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/SVG/Voron_250_60mm_2tools_left_TPU.svg\"\
        >](STL/Plates/Voron/250/2%20Tools/60mm%20Wide%20Dock/TPU/Left/) |[<img src=\"\
        https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/SVG/Voron_250_60mm_2tools_right_TPU.svg\"\
        >](STL/Plates/Voron/250/2%20Tools/60mm%20Wide%20Dock/TPU/Right/) |[<img src=\"\
        https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/SVG/Voron_250_60mm_2tools_center_TPU.svg\"\
        >](STL/Plates/Voron/250/2%20Tools/60mm%20Wide%20Dock/TPU/Center/) |[<img src=\"\
        https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/N3MI-DG/Umbilical_plates_V2/SVG/Voron_250_60mm_2tools_split_TPU.svg\"\
        >](STL/Plates/Voron/250/2%20Tools/60mm%20Wide%20Dock/TPU/Split/) |\n| 3 |\
