      readme_data: "This is a mod of N3mi's umbilical back plate modded to fit the\
        \ Sovol Sv08.\nSV08 Umbilical Back Plate\n\n\n\n\nDescription\n\nThis mod\
        \ enhances the gameplay experience by introducing new features, improving\
        \ mechanics, and adding unique content. Whether you're looking for better\
        \ visuals, additional functionality, or a fresh take on existing elements,\
        \ this mod delivers an exciting new way to play.\n\nFeatures\n6 umbilical\
        \ ports for 6 toolheads\n\n<img src=\"https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/seenit783/SV08%20Umbilical%20Back%20Plate/umbilical%202.jpg\"\
        \  width=\"500\" />\n<img src=\"https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/seenit783/SV08%20Umbilical%20Back%20Plate/umbilical%20one.jpg\"\
        \  width=\"500\" />\nCompatibility\n\nThis mod is only compatible with [Sovol\
        \ Sv08] and works well with https://github.com/DraftShift/CableManagement/tree/main/UserMods/N3MI-DG/Umbilical_Restraints\n\
        \nCredits\n\nOriginally Developed by [N3mi]. \n\nFeel free to modify and share,\
        \ but please give credit!\n\n"
