  - username: FlisherOfatale
    mods:
    - name: PTFE_Breakout_Block
      path: UserMods/FlisherOfatale/PTFE_Breakout_Block
      title: PTFE Breakout Block
      url: https://github.com/DraftShift/CableManagement/tree/main/UserMods/FlisherOfatale/PTFE_Breakout_Block
      created_commit: ba9f5e2569b3e2a558f38b367512aaa80b84981a
      created_date: '2024-11-12T15:02:13Z'
      has_readme: true
      readme_data: "# PTFE Breakout Block\n\n![PTFE Breakout Block](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/FlisherOfatale/PTFE_Breakout_Block/image2.jpg)\n\
        \n## What is it?\nI designed the Breakout Block with the following idea in\
        \ mind:\n* Similar \"lenght\" than the stock Voron Spool Holder so it maintain\
        \ existing clearance for people using the original setup\n* Provide some constrain\
        \ to the PTFE so it doesn't king when using 3mm innder diameter\n* use ECAS\
        \ because they are practical for this purpose\n* Optional, seconary part that\
        \ serve as a breakout block, allowing to \"detach\" easily both side of the\
        \ block to decouple the toolhead and the spool holder when doing printer maintenance\n\
        \n## Special Notes\nThe design is probably not perfect but it was good enought\
        \ for me at this point.\n\n## Files\n* [Main part v3.1](Flisher-PTFE_Breakout_Block_Main-v3.1.stl)\n\
        * [Secondary Part v3.1](Flisher-PTFE_Breakout_Block_Secondary-v3.1.stl)\n\
        * [Step File](Flisher-Toolchanger-PTFE-Holder-v3.1.STEP)\n\n## BOM\n* 2x M3\
        \ T-Nuts or Roll-in Nuts\n* 2x M3x12 SHCS Screws \n* 1x ECAS Connector per\
        \ Lane you want activate\n\n\nIf using both parts\n* 2x M3x16 SHCS Screws\
        \ (Voron Sandard)\n* 2x M3 heat insert (Voron Sandard)\n* Additional 1x ECAS\
        \ Connector per Lane you want activate (ie: 12 totals if using 6 toolheads)\n\
        \n## Instructions\n### Main Part\n* Validate that your PTFE can go trought\
        \ easily, if not, you might have to deburr rthe side facing the bed.\n* Install\
        \ the ECAS connectors\n* Screw to the back of the printer using M3 T-Nuts\
        \ and M3x12 SHCS Screws\n\nYou can stop here if you only wanted something\
        \ to constrain the filament path and use it as a passtrought\n\n### Secondary\
        \ part\n* Validate that your PTFE can go trought easily, if not, you might\
        \ have to deburr rthe side facing the bed.\n* Install the ECAS connectors\n\
        * Install the 2 heats inserts (on the same side than the ECAS connector)\n\
        * Install on the main block by using 2x M3x16 SHCS Screws\n* Push the PTFE\
        \ coming from the main part as it can get 2mm inside \n* Attach the PTFE from\
        \ the printer side\n  \nYou now have a setup you can decouple by pulling the\
        \ filament back to the spool holders and unscrewing the block.\n\n### Additional\
        \ Pictures\n![Secondary Partg](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/FlisherOfatale/PTFE_Breakout_Block/image1.jpg)\n\
        \n## Changelog\n* V3.1 2024-03-24 - Initial Release, each parts are 12mm wide"
      thumbnail: https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/FlisherOfatale/PTFE_Breakout_Block/image2.jpg
      images:
      - https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/FlisherOfatale/PTFE_Breakout_Block/image1.jpg
      - https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/FlisherOfatale/PTFE_Breakout_Block/image2.jpg
