    - name: Xol-Toolhead
      path: UserMods/MikeYankeeOscarBeta/Xol-Toolhead
      title: DEPRECATED
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/MikeYankeeOscarBeta/Xol-Toolhead
      created_commit: ff38729751c848ef2683c0523ff4f33d91bc98b1
      created_date: '2024-01-31T16:46:17Z'
      has_readme: true
      readme_data: "# DEPRECATED\ndeprecated and no longer needed to use xol with\
        \ stealthchanger. use the mainline xol backplate and xol modular docks instead\n\
        \n# StealthChanger Xol-Toolhead for StealthChanger V1.0 (Experimental) \n\
        by [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/) (VoronDesign\
        \ Discord: #MikeyMike V2.5796, Voron Toolchangers Discord: MikeyMike - Github:\
        \ [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/StealthChanger))\n\
        \n[Xol Toolhead](https://github.com/Armchair-Heavy-Industries/Xol-Toolhead)\
        \ by [Armchair Heavy Industries](https://github.com/Armchair-Heavy-Industries)\n\
        \n### This is EXPERIMENTAL If you have issues, please post them on the tapchanger\
        \ discord ASAP!\n\n## Description\nStealthChanger parts compatible with Xol-Toolhead\
        \ (Experimental)\n\nBased on StealthChanger StealthBurner Parts.\n\nFor crossbar\
        \ (horizontal 2020 aluminium extrusion in front of printer) only!\n\nDesigned\
        \ to be compatible with all Xol-Toolhead hotend versions as of 2024-01-23.\
        \ \n(However only Revo Voron and Rapido 2 UHF has been tested)\n\nMCU Toolhead\
        \ mount only compatible with Sherpa-Mini and EBB36\n\n\n\n#### NB! StealthChanger-Rods\
        \ Xol-Toolhead dock has it's own docking tool-path. Remember to add it and\
        \ change to 'stealthchanger_xol' in your toolhead config.\n```\nparams_stealthchanger_xol_path:\
        \ [{'y':59, 'z':17.5},{'y':5, 'z':17.5},{'y':5, 'z':0.2},{'y':0.5, 'z':0.1},{'z':0,\
        \ 'y':0, 'f':0.5},{'z':-10, 'y':0}, {'z':-10, 'y':16}]\n```\n\nExample:\n\
        ```\n[tool T0]\ntool_number: 0\nextruder: extruder\nparams_type = 'stealthchanger_xol'\n\
        fan: multi_fan T0_partfan\ngcode_x_offset: 0\ngcode_y_offset: 0\ngcode_z_offset:\
        \ 0\n```\n\n## BOM:\n| Part                        | Amount    | Description\
        \                                                      |\n|-----------------------------|-----------|------------------------------------------------------------------|\n\
        | 6x3 magnets                 | 6         | (N52 recommended)  2x for dock,\
        \ 3x for shuttle 1x for plate      |\n| M3x6mm FHCS screw           | 2  \
        \       | Has to be magnetic (not stainless)                             \
        \  |\n| springsteel plate           | 1         | max 10mm wide, max 1mm thick,\
        \ with M4 hole (I used blades from a [feeler gauge](https://www.biltema.no/en-no/car---mc/car-tools/engine-tools/spark-plug-tools/feeler-gauge-mminches-2000028588)\
        \ )        |\n| M4 screw                    | 1         | Maximum 6.3mm wide\
        \ screw head                                    |\n| M3x14mm screw       \
        \        | 2         | Recommend BHCS or SHCS, but any M3 screw will work\
        \               |\n| M3 T-slot nut               | 2         | Any M3 2020\
        \ T-Slot Nut will work (recommend springnuts)          |\n| M3 heatset nut\
        \ (5x4x3)      | 8         | (Voron Standard) 6 for Plate and 2 for EBB36\
        \ mount               |\n\n\n## Assembly\n- Print\n    - Xol-Toolhead_Dock\n\
        \    - Xol-Toolhead_MaglockFaceplate\n    - StealthChanger_Xol-Toolhead_Plate\n\
        \    - StealthChanger_Xol-Toolhead_EBB36_Mount\n    - StealthChanger shuttle\
        \ (if you haven't already)\n- Push and glue in magnets\n- Insert springsteel\
        \ plate into slot in the Dock\n- Cut and bend springsteel plate to fit your\
        \ toolhead\n- (optional) apply/mold silicone to the springsteel plate\n- Fix\
        \ the springsteel plate in place with the m4 screw\n- Screw it onto the 2020\
        \ aluminium extrusion\n\n"
      thumbnail: null
      images: []
      stls:
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/MikeYankeeOscarBeta/Xol-Toolhead/STL/StealthChanger_Xol-Toolhead_EBB36_Mount.stl
