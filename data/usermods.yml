    - name: Rapidburner Goliath
      path: UserMods/Apprisco/Rapidburner Goliath
      title: Rapidburner Goliath Magdock Adapter
      url: https://github.com/DraftShift/ModularDock/tree/main/UserMods/Apprisco/Rapidburner%20Goliath
      created_commit: b674e0aaf559999e0183ccafeb4b6e2cde294377
      created_date: '2026-02-18T00:50:22Z'
      has_readme: true
      readme_data: "# Rapidburner Goliath Magdock Adapter\n\n## Credits\n- Apprisco\
        \ — Voron, Monolith, Draftshift Design Discord\n\n---\n\n## Print Instructions\n\
        \nPrint the following parts:\n\n- **1×** `frame_left_mag`\n- **1× mirrored**\
        \ `frame_left_mag` *(for the right side)*\n- **1×** `6mag_RB_Goliath_Cowl_1.5x6mm.stl`\n\
        - **1×** `6mag_RB_dock_base_2x6mm.stl`\n\n> **IMPORTANT:**  \n> `frame_left`\
        \ is the **non-Magdock** version and is **not recommended**, since **Rapidburner\
        \ Goliath (RBG) toolheads are heavy**.\n\n---\n\n## Reference Images\n\nhttps://github.com/user-attachments/assets/c9cb2046-8695-4a89-a174-23dc2d65bfda\n\
        \nhttps://github.com/user-attachments/assets/0fb0bd0d-f933-4490-a703-011aabf8589f\n\
        \n<img width=\"925\" height=\"1097\" alt=\"image\" src=\"https://github.com/user-attachments/assets/18b84876-727c-4e92-b1ad-17dd0e7f7ecc\"\
        \ />\n\n<img width=\"1045\" height=\"616\" alt=\"image\" src=\"https://github.com/user-attachments/assets/7823ef60-c9d8-4589-b3ab-2353c6586354\"\
        \ />\n\n*Tool hanging upside down.*\n\n---\n\n## Hardware Requirements\n\n\
        - **8 mm spacers** are required to space out the main **M3 screws** so the\
        \ Rapidburner Goliath mates correctly with the magnets in the frame.\n- Use\
        \ **main M3 screws that are 8 mm longer** than stock for the RBG.\n  - Screws\
        \ **must be magnetic** (not stainless steel).\n\n- **Dock:** 4× **6 mm × 2\
        \ mm** N52 magnets  \n- **Cowl:** 4× **6 mm × 1.5 mm** N52 magnets  \n- **Frame:**\
        \ 2× **6 mm × 3 mm** N52 magnets  \n\n---\n\n## Notes\n\n- Height is matched\
        \ with the original RBG.\n- Nozzle still protrudes — probing and printing\
        \ unaffected.\n- Cartographer compatibility maintained.\n- WWG2 extruder used\
        \ in example image with a modified version of Took's EBB36 WWG2 mount & modded\
        \ EBB36 cover with fan.\n"
