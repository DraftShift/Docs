      has_readme: true
      readme_data: "# PTFE Output Ramp Variations  \nSingle, Double, Triple, Four,\
        \ Five and Six Way Variations for the PTFE Ramp on FannyPack\nThese are to\
        \ be used in conjunction with N3MI's backplate. When I went to use this, I\
        \ found that the PTFE I/O didn't align with the output ramp\nwhich would cause\
        \ very tight bends in the PTFE which would cause excessive drag on the filament.\
        \  In a bid to resolve this, I relocated the PTFE\nRamp Coupler positions\
        \ to make them as straight as possible.  This requires no additional hardware\
        \ than would be used for the original.\n\n![FannyPack1](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/MugenMicko/PTFE%20Output%20Ramp%20Variations/Images/FannyPack1.jpg)\n\
        ![FannyPack2](https://raw.githubusercontent.com/DraftShift/CableManagement/main/UserMods/MugenMicko/PTFE%20Output%20Ramp%20Variations/Images/FannyPack2.jpg)\n\
        \n# Credits\n- [N3MI-DG](https://github.com/N3MI-DG) for the Filament Entry\
        \ Design this is based on\n\n"
