    - name: Zbillical
      path: UserMods/Nic335/Zbillical
      title: Z-Umbilical Alternative for Voron 2.4 350mm ( deprecated )
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/Nic335/Zbillical
      created_commit: 3c88709dd82de25e16df451b3e09796992005b97
      created_date: '2024-06-17T02:15:27Z'
      has_readme: true
      readme_data: "# Z-Umbilical Alternative for Voron 2.4 350mm ( deprecated )\n\
        This usermod has been deprecated and is retained for legacy purposes only.\n\
        \nWe are excited to present the Z-Umbilical Alternative, a superior replacement\
        \ for the traditional Z-chain on the Voron 2.4 350mm. This innovative solution\
        \ was developed in collaboration with FizzySG, the brilliant mind behind the\
        \ EMS system.\n\n## Key Features\n- **Seamless Integration:** Designed to\
        \ fit perfectly with the Voron 2.4 350mm, ensuring a smooth and hassle-free\
        \ installation.\n- **Enhanced Performance:** Offers improved stability and\
        \ reduced wear compared to the conventional Z-chain, resulting in a more reliable\
        \ and efficient printing experience.\n- **Clean Aesthetic:** Provides a sleek\
        \ and tidy appearance, enhancing the overall look of your 3D printer.\n- **Collaborative\
        \ Design:** Created with input from FizzySG, leveraging the expertise behind\
        \ the EMS system to deliver a top-notch solution.\n- **Flexible Installation:**\
        \ Can be installed in two ways, with one method allowing for an easier upgrade\
        \ without the need to change all the wires.\n\n## Benefits\n- **Reduced Maintenance:**\
        \ Less prone to wear and tear, leading to fewer maintenance requirements and\
        \ longer-lasting performance compared to Z-chain wire breakages.\n- **Increased\
        \ Print Quality:** By minimizing vibrations and ensuring consistent motion,\
        \ it helps achieve higher print quality, especially during fast Z movements\
        \ for tool changing. This results in smoother transitions and more precise\
        \ positioning, crucial for multi-tool setups.\n- **Ease of Use:** Designed\
        \ with user-friendliness in mind, making it accessible even for those new\
        \ to 3D printing modifications.\n\n## Bill of Materials (BOM)\nTo successfully\
        \ install the Z-Umbilical, you will need the following components:\n- 4 x\
        \ M3x6 screws\n- 4 x M3 threaded inserts\n- To mount on extrusion:\n  - 4\
        \ x Either M3 or M4 T-nuts\n  - 4 x Either M3x6 or M4x6 screws\n- A few tie-wraps\
        \ to hold cables in place\n- Piano wire 1.0mm stainless steel spring wire\
        \ 1.0mm\n- PET sleeve\n\nUpgrade your Voron 2.4 350mm with the Z-Umbilical\
        \ Alternative and experience the difference in performance and aesthetics.\
        \ Join the community of enthusiasts who trust this collaborative innovation\
        \ for their 3D printing needs.\n\n## Credits\nSpecial thanks to FizzySG for\
        \ his invaluable contributions and collaboration in giving some “Style” to\
        \ this project! Be sure to check out FizzySG’s other amazing projects and\
        \ offerings to enhance your 3D printing experience even further.\n\n![RealPicture](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/Zbillical/Images/RealPicture.png)\n\
        ![Render of top mount](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/Zbillical/Images/TopZbillicalMount.png)\n\
        ![Render of complete view](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/Zbillical/Images/Zbillical_CompleteView.png)\n\
        ![Render of back of the top mount](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/Zbillical/Images/BackOfMount.png)\n\
        \n"
      thumbnail: https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/Zbillical/Images/RealPicture.png
      images:
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/Nic335/Zbillical/Images/BackOfMount.png
