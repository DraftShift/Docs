    - name: Endstop_Mounts
      path: UserMods/N3MI-DG/Endstop_Mounts
      title: Endstop Mounts
      url: https://github.com/DraftShift/StealthChanger/tree/main/UserMods/N3MI-DG/Endstop_Mounts
      created_commit: a2102326368f62d7d0418f820c6f804cf44de2d9
      created_date: '2025-05-14T17:25:07Z'
      has_readme: true
      readme_data: "# Endstop Mounts\n\nThis repository contains designs for three\
        \ types of shuttle:\n\n- **Fysetc**: For the Fysetc CNC shuttle.\n- **LDO**:\
        \ For the LDO CNC shuttle.\n- **3D Printed**: The 3D printed V1.1 Shuttle.\n\
        \n## Table of Contents\n\n- [Overview](#overview)\n- [Bill of Materials (BOM)](#bill-of-materials)\n\
        \  - [A Drive Endstop Mount BOM](#a-drive-endstop-mount-bom)\n  - [3D Printed\
        \ BOM](#3d-printed-bom)\n  - [Fysetc & LDO BOM](#fysetc--ldo-bom)\n- [Installation](#installation)\n\
        \  - [A Drive Endstop Mount](#a-drive-endstop-mount)\n  - [Fysetc & LDO CNC\
        \ Shuttles](#fysetc--ldo-cnc-shuttles)\n  - [3D Printed Shuttle](#3d-printed-shuttle)\n\
        - [Configuration](#configuration)\n\n## Overview\n\nThe switches for this\
        \ solution are located in a block that mounts to the rear extrusion of the\
        \ gantry and sits in the standard A motor mount. The 2 CNC versions have both\
        \ alignment guides and an endstop bracket. The 3D printed version has only\
        \ the endstop bracket.\n\n## Bill of Materials\n\n### A Drive Endstop Mount\
        \ BOM\n\n- **4** M2x10 Self tapping screws\n- **1** M3x30 SHCS screw\n- **1**\
        \ 2020 Drop in T-Nut\n- **2** D2F_L Microswitches\n- **1** JST XH 3 Pin Male\
        \ Header\n\n### 3D Printed BOM\n\n- **1** M3x10 SHCS screw\n- **1** M3x25\
        \ SHCS screw\n\n### Fysetc & LDO BOM\n\n- **1** M3x10 SHCS screw\n- **1**\
        \ M3x20 SHCS screw\n- **1** M3x30 SHCS screw\n\n## Installation\n\n### A drive\
        \ Endstop Mount\n\n1. Install the switches using the 4 M2x10 self tapping\
        \ screws.\n![switches](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/switches.jpg)\n\
        \n2. Push the JST HX header into the back hole, bend the NC (normally connected)\
        \ pin of the bottom switch so that it aligns with the JST header pin and solder\
        \ them together.\n![solder pin](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/solder1.jpg)\n\
        \n3. Solder wires connecting both C (common) pins on the switches to a single\
        \ pin on the JST XH header. Solder a wire connecting the remaining NC pin\
        \ on the top switch and the last JST HX pin.\n![solder wires](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/solder2.jpg)\n\
        \n4. Install the 2020 drop in T-nut into the front of the rear gantry extrusion\
        \ and secure the endstop mount into the A drive with the M3x30 SHCS screw.\n\
        ![mounted](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/mount.jpg)\n\
        \n### Fysetc & LDO CNC Shuttles\n\n1. Press in the guide pieces from the front\
        \ in to their respective holes making sure they are seated all the way.\n\
        ![fysetc guides](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/fysetc.jpg)\n\
        ![ldo guides](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/ldo.jpg)\n\
        \n2. Mount the endstop bracket to the rear of the shuttle with the M3x10 SHCS\
        \ and M3x20 SHCS screws screwing into the alignment guides. Because you are\
        \ screwing in to plastic, be sure not to overtighten.\n\n3. Install and adjust\
        \ the M3x30 SHCS screw so that it cannot hit the B motor and aligns with the\
        \ bottom switch on the A drive endstop mount.\n![fysetc rear](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/fysetc_rear.jpg)\n\
        ![fysetc cad](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/image-1.png)\n\
        \n### 3D Printed Shuttle\n\n1. Mount the endstop bracket to the rear of the\
        \ shuttle with the M3x10 SHCS.\n\n2. Install and adjust the M3x25 SHCS screw\
        \ so that it cannot hit the B motor and aligns with the bottom switch on the\
        \ A drive endstop mount.\n![printed](https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/printed.jpg)\n\
        \n## Configuration\n\nEnsure that you have `homing_rebound_y` in the `[toolchanger]`\
        \ section of your config set to zero and `sensorless_x` & `sensorless_y` set\
        \ to false.\n"
      thumbnail: https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/switches.jpg
      images:
      - https://raw.githubusercontent.com/DraftShift/StealthChanger/main/UserMods/N3MI-DG/Endstop_Mounts/images/fysetc.jpg
