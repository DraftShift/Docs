  - username: MikeYankeeOscarBeta
    mods:
    - name: Doorbuffer_Adapters
      path: UserMods/MikeYankeeOscarBeta/Doorbuffer_Adapters
      title: Doorbuffer Adapters for Monolith_Crossbar
      url: https://github.com/DraftShift/DoorBuffer/tree/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Adapters
      created_commit: 3b46023be58d17f402406992664f2f62e57e612b
      created_date: '2024-12-29T08:42:20Z'
      has_readme: true
      readme_data: "# Doorbuffer Adapters for Monolith_Crossbar\nbased on DoorBuffer\
        \ Adapter by [TheSin-](https://github.com/TheSin-/) \n\nMonolith AWD mod by\
        \ [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/) (VoronDesign\
        \ Discord: #MikeyMike V2.5796, Voron Toolchangers Discord: MikeyMike - Github:\
        \ [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/StealthChanger))\n\
        DraftShiftDesign Discord - user-project thread:    https://discord.com/channels/1226846451028725821/1243948065208008705\n\
        \n\nThis mod allows you to use extrusions that are cut to the inside length\
        \ of your front frame for monolith adapters.\n\n### Only tested with R0 Printed\
        \ Monolith AWD (pre-live shaft version)\n\nPrintable adapters for crossbar\
        \ to clear monolith AWD front motors for Voron V2 with StealthChanger\n\n\
        Have to cut the 2020 to size.\nThe monolith AWD motors take 45mm on each side\
        \ so the 2020 has to be 90mm shorter than the frames horizontal extrusions\n\
        \n## BOM:\n| Part                        | Amount    | Description       \
        \                                                                        \
        \               |\n|-----------------------------|-----------|----------------------------------------------------------------------------------------------------------|\n\
        | M3 T-slot nut               | 4         | Any M3 2020 T-Slot Nut will work\
        \ (recommend springnuts)                                                 \
        \ |\n| M5x15mm BHCS/SHCS Screw     | 2         | M5 BHCS/SHCS socket head\
        \ screw, 15mm minimum (longer is better if you can tap the extrusion deeper\
        \ than 10mm) |\n| M3x20mm SHCS Screw          | 4         | M3 screw, BHCS\
        \ will also work                                                         \
        \                   |\n| 2020 extrusion              | 1         | 2020 extrusion\
        \ cut to length (see table below), tapped on both ends. Misumi#: HFS5-2020-380-TPW\
        \  / HFSB5-2020-380-TPW                    |\n| M3x25mm SHCS Screw       \
        \   | 4         | M3 screw, BHCS will also work                          \
        \                                                  |\n\n### Extrusion lengths\
        \ for Stock V2 sizes:\n| Model                 | Calculation           | Monolith\
        \ AWD Crossbar extrusion length                      |\n|-----------------------|-----------------------|-------------------------------------------------------------|\n\
        | Voron V2-350          | 470.00 mm - 90mm      | 380 mm                 \
        \                                     |\n| Voron V2-300          | 420 mm\
        \ - 90mm         | 330 mm                                                \
        \      |\n| Voron V2-250          | 370 mm - 90mm         | 280 mm       \
        \                                               |\n| Voron V2-custom size\
        \  | [horizontal extrusion length] - 90mm         | x mm                 \
        \              |\n"
      thumbnail: null
      images: []
      stls:
      - https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Adapters/STL/2020_doorbuffer_adapter_monolith.stl
      cads:
      - https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Adapters/CAD/2020_doorbuffer_adapter_monolith.step
      code: []
    - name: Doorbuffer_Clicky-Clack_Side_Door
      path: UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door
      title: Doorbuffer Clicky-Clack Side Door
      url: https://github.com/DraftShift/DoorBuffer/tree/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door
      created_commit: 5db71a3fe397eeee94fdbea23379218bc37bfa76
      created_date: '2025-07-01T15:59:18Z'
      has_readme: true
      readme_data: "# Doorbuffer Clicky-Clack Side Door\n\nThe Stock Voron V2 doors\
        \ suck. Adding an additional 20mm more out the front to mount Clicky-Clack\
        \ fridge door not too tempting?\nWant to have access to your umbilicals and\
        \ electronics on the back?\nFeel like the docks are in the way when reaching\
        \ for prints?\n\nAdd a ClickyClacky Fridge Door to the side of your printer\
        \ instead with this mod!\n\n\n## Description:\nThis Usermod replaces the right\
        \ top and bottom corners of the door-buffer and uses most of the original\
        \ parts from the Clicky-Clack Fridge door mod: https://github.com/tanaes/whopping_Voron_mods/blob/main/clickyclacky_door%2FREADME.md\n\
        Recommend using these hinges to move the side panel to the front so it's easily\
        \ removeable: https://github.com/DraftShift/DoorBuffer/tree/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Side_Door_latches\n\
        \nIt's designed for a 300 size Voron V2 with the normal height door-buffer,\
        \ but should fit the other printer sizes for normal height docks.\n\nby \n\
        [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/) (VoronDesign\
        \ Discord: #MikeyMike V2.5796, Voron Toolchangers Discord: MikeyMike - Github:\
        \ [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/StealthChanger))\n\
        DraftShiftDesign Discord - user-project thread:    https://discord.com/channels/1226846451028725821/1243948065208008705\n\
        \n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door/images/clicky-clack_img1.jpg\"\
        \ width=\"400\"/>\n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door/images/clicky-clack_img2.jpg\"\
        \ width=\"400\"/>\n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door/images/clicky-clack_img3.jpg\"\
        \ width=\"400\"/>\n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door/images/clicky-clack_img4.jpg\"\
        \ width=\"400\"/>\n<img src=\"https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door/images/clicky-clack_img5.jpg\"\
        \ width=\"400\"/>\n\n## Parts to print:\n- 1x doorbuffer-300-clickyclacky-sidedoor_A_v2.stl\n\
        - 1x doorbuffer-300-clickyclacky-sidedoor_A_v2.stl\n\n## BOM:\nUnchanged.\
        \ It uses all the same hardware as door buffer and clicky-clack fridge door."
      thumbnail: https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door/images/clicky-clack_img1.jpg
      images:
      - https://raw.githubusercontent.com/DraftShift/DoorBuffer/main/UserMods/MikeYankeeOscarBeta/Doorbuffer_Clicky-Clack_Side_Door/images/clicky-clack_img1.jpg
