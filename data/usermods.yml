    - name: Xol_magdock_feet
      path: UserMods/MikeYankeeOscarBeta/Xol_magdock_feet
      title: XOL Magdock Feet
      url: https://github.com/DraftShift/ModularDock/tree/main/UserMods/MikeYankeeOscarBeta/Xol_magdock_feet
      created_commit: 86a8ae25d361d8112b3bb952fee835467c97a1af
      created_date: '2025-04-20T14:28:14Z'
      has_readme: true
      readme_data: "# XOL Magdock Feet\nby [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/)\
        \ (DraftShift Discord: #MikeyMike, VoronDesign Discord: #MikeyMike V2.5796,\
        \ Voron Toolchangers Discord: MikeyMike - Github: [MikeYankeeOscarBeta](https://github.com/MikeYankeeOscarBeta/StealthChanger))\n\
        \nMegnetic dock \"feet\" for Xol-toolhead StealthChanger and Modular-Docks.\n\
        Improves docking/undocking reliability and keeps the toolhead from falling\
        \ off or moving if you bump or flip the printer.\n\nFor further improved docking/undocking\
        \ combine this mod with the Xol_magdock_adapter mod https://github.com/DraftShift/ModularDock/tree/main/UserMods/MikeYankeeOscarBeta/Xol_magdock_adapter\n\
        \nIndividual adapters for NF (normal flow) and UHF (high/ultra high flow)\
        \ versions of XOL-toolhead.\n\n<img src=\"https://raw.githubusercontent.com/DraftShift/ModularDock/main/UserMods/MikeYankeeOscarBeta/Xol_magdock_feet/images/xol_magdock_feet_2.png\"\
        \ width=\"400\"/>\n<img src=\"https://raw.githubusercontent.com/DraftShift/ModularDock/main/UserMods/MikeYankeeOscarBeta/Xol_magdock_feet/images/xol_magdock_feet_1.jpg\"\
        \ width=\"400\"/>\n\n## Parts to print\n### NF (normal flow / \"short\")\n\
        - SC_XOL_nf_Feetmags.stl (replaces stealthchanger XOL_Short.stl) \n- DSD_Modular_Dock_Back_XOL_Feetmags.stl\
        \ (replaces ModularDock/XOL/Back.stl)\n### UHF (ultra high flow / \"medium\"\
        )\n- SC_XOL_Feetmags_UHF.stl  (replaces stealthchanger XOL_Medium.stl) \n\
        - DSD_Modular_Dock_Back_XOL_Feetmags.stl (replaces ModularDock/XOL/Back.stl)\n\
        \n## BOM additions:\n| Part                           | Amount    | Description\
        \                                          | Link |\n|--------------------------------|-----------|------------------------------------------------------|-|\n\
        | 2x8mm FHCS self-tapping Screw  | 4         | Magnetic 2x8mm Countersunk\
        \ self-tapping screw (not stainless)     | https://aliexpress.com/item/1005001715736935.html\
        \                                                   |\n| Countersunk m2 6x3\
        \ Magnets    | 4         | Countersunk n52 magnets, but lower strength also\
        \ works | https://aliexpress.com/item/1005008755692873.html  |\n\nAlternatively\
        \ you can glue in normal 6x3 magnets with a good high temperature two component\
