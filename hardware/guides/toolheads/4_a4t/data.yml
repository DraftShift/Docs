title: A4T
author: "DraftShift Design"
primary_parts:
  - WWBMG Motor Plate
  - WWBMG Body
  - LED Carrier
  - LED Filter
  - Fan Insert Left
  - Fan Insert Right
accent_parts:
  - Cowl
  - A4T Backplate
  - PCB Mount
  - WWBMG Tension Arm
  - Fan Duct
summary: >
  This guide will walk you through the assembly of an A4T (UHF) toolhead for StealthChanger.

  !!! note "Configurations"
      The A4T can be configured in numerous ways. This guide is an example of the A4T toolhead with a Rapido2 UHF hotend and a pre-assembled A4T WWBMG extruder.

      Other configurations may differ from this guide.

      - For StealthChanger, only XOL variants of the A4T cowl can be used.
      - A4T toolhead requires the use of lower profile Z joints. hartk's [GE5C Z Joint](https://github.com/VoronDesign/VoronUsers/tree/main/printer_mods/hartk1213/Voron2.4_GE5C){target="_blank"} or Ellis' [Short Z Joints](https://github.com/VoronDesign/VoronUsers/tree/main/printer_mods/Ellis/Short_Z_Joints){target="_blank"} are good options.

printed_bom:
  Complete A4T:
    qty: 1
    urls:
      Link: "https://download-directory.github.io/?url=https://github.com/N3MI-DG/sc-guides/tree/main/A4T/STL"

hardware_bom:
  M3x8 BHCS Screws:
    qty: 2
  M3x10 BHCS Screws:
    qty: 2
  M3x16 BHCS Screws:
    qty: 2
  M2.5x8 SHCS Screws:
    qty: 4
  M3x8 SHCS Screws:
    qty: 5
  M3x45 SHCS Screws:
    qty: 2
  M3 Heat Insert:
    qty: 2
  M3 Square Nuts:
    qty: 4
  Rapido2 UHF Hotend:
    qty: 1
  A4T WWBMG Extruder:
    qty: 1
  EBB36 Toolhead Board:
    qty: 1
  25x10mm Delta Radial Fan:
    qty: 1
  40x10mm Centrifugal/Blower Fan:
    qty: 2
  4x2mm PTFE ~33mm Long:
    qty: 1
  Neopixel LED:
    qty: 3

resources:
  A4T Github: https://github.com/Armchair-Heavy-Industries/A4T
  N3MI's CAD and STL collection: https://github.com/N3MI-DG/sc-guides/tree/main/A4T

